name: process-video

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Google Drive file id of the raw video"
        required: false
        default: ""
      youtube_url:
        description: "Or a YouTube URL"
        required: false
        default: ""
      mode:
        description: "auto | single | long"
        required: false
        default: "auto"
      clips:
        description: "Max reels from a long video"
        required: false
        default: "5"

concurrency:
  group: process-video
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: System deps
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-core
      - run: pip install -r pipeline/requirements.txt
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'small' }}
      - name: Run pipeline
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.DRIVE_OUTPUT_FOLDER_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}
        run: |
          python pipeline/run.py \
            --file-id "${{ inputs.file_id }}" \
            --youtube-url "${{ inputs.youtube_url }}" \
            --mode "${{ inputs.mode }}" \
            --clips "${{ inputs.clips }}"
